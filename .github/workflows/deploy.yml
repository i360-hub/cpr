# Push-to-deploy: build the Astro site and deploy the Cloudflare Worker
# (`wrangler deploy` — Worker `cpr` + static assets from dist/, per wrangler.toml),
# then ping IndexNow with the fresh sitemap URLs.
#
# Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
# The API token needs "Workers Scripts: Edit" (this is a Worker deploy, not Pages).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Expose the token to `if:` so deploy self-skips when the secret isn't set yet
    # (a missing token means "skip deploy", never "fail the run").
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap's <lastmod> values are resolved from git
          # commit dates at build time (scripts/lastmod.mjs). A shallow clone
          # would silently ship a sitemap with no freshness signal at all.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy Cloudflare Worker (production)
        if: ${{ github.event_name != 'pull_request' && env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin Wrangler 4. The action bundles 3.90.0, and v3 silently ignores
          # the v4-only `[assets] run_worker_first` field ("Unexpected fields
          # found in assets field"), so the Worker only runs on asset MISSES —
          # apex->www + security headers + legacy redirects on real pages never
          # fire. Local deploys already use v4; this makes CI match.
          wranglerVersion: '4'
          command: deploy

      - name: Smoke-check production
        if: ${{ github.event_name != 'pull_request' && env.CF_API_TOKEN != '' }}
        run: |
          sleep 10
          echo "production must serve 200..."
          curl -sf -o /tmp/page.html "https://www.carolinaprorestoration.com/?cb=$(date +%s)"
          echo "canonical must point at production domain..."
          grep -q 'https://www.carolinaprorestoration.com' /tmp/page.html
          echo "All checks passed."

      # Ping IndexNow with the just-built sitemap URLs so Bing/Yandex/etc. recrawl
      # promptly. Same guard as deploy (real deploy + token present). Key is public
      # (served at /<key>.txt), so no secret needed. Best-effort — a failure here
      # must not fail the run.
      - name: Notify IndexNow
        if: ${{ github.event_name != 'pull_request' && env.CF_API_TOKEN != '' }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error
          key  = "a0175dedf5ede928c17f1f49b2672623"
          host = "www.carolinaprorestoration.com"
          urls = re.findall(r"<loc>(.*?)</loc>", open("dist/sitemap-0.xml", encoding="utf-8").read())
          if not urls:
              raise SystemExit("No URLs found in dist/sitemap-0.xml")
          body = {
              "host": host,
              "key": key,
              "keyLocation": f"https://{host}/{key}.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(body).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              r = urllib.request.urlopen(req, timeout=30)
              print(f"IndexNow accepted (HTTP {r.status}) — submitted {len(urls)} URLs")
          except urllib.error.HTTPError as e:
              print(f"IndexNow HTTP {e.code}: {e.read().decode(errors='replace')}")
              raise
          PY
